name: Issue344 retained keyboard witness native Windows and Node24 SDK QA

on:
  push:
    branches: [source/issue344-keyboard-witness-qa-20261010]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue344-keyboard-native-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-msvc:
    if: github.repository == 'shannon0430/cua' && github.ref == 'refs/heads/source/issue344-keyboard-witness-qa-20261010'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      QA_ARTIFACT_REL: issue344-keyboard-native-qa
      CARGO_BUILD_JOBS: '4'
      RUST_BACKTRACE: '0'
    steps:
      - name: Preserve exact LF source bytes for hash verification
        run: |
          & git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve exact source bytes' }
          & git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve LF source bytes' }

      - name: Checkout exact pushed candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # upstream v4 pin
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false

      - name: Verify final source manifest and record honest QA scope
        run: |
          $ErrorActionPreference = 'Stop'
          & git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot pin checkout byte policy' }
          & git config --local core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot pin LF checkout policy' }
          & git checkout-index --force --all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot materialize exact LF checkout' }
          $out = Join-Path $env:RUNNER_TEMP $env:QA_ARTIFACT_REL
          New-Item -ItemType Directory -Force $out | Out-Null
          $manifestPath = '.github/issue344-keyboard-native-qa-manifest.json'
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $base = '36987990b292537770fe2df3a9e6dee2ef43db2f'
          if ($manifest.baseCommit -ne $base) { throw 'Unexpected public source base' }
          if ($manifest.sourceStatus -ne 'author_frozen_for_native_qa') { throw 'Final author freeze required before CI' }
          if ($manifest.baseCandidatePatchSha256 -ne '02a81b766a75f1ca24db9b453d3c8545d469dbf328d9c3df79ec3892c0a1fc21') { throw 'Frozen prior causal patch mismatch' }
          if ($manifest.keyboardWitnessPatchSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Final keyboard patch provenance hash required' }
          if ($manifest.authorManifestSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Final author manifest binding required' }
          if ($manifest.nativeQa.expectedPriorHelperTests -ne 13) { throw 'Exactly 13 prior helpers required' }
          if ($manifest.nativeQa.nodeVersion -ne '24.19.0') { throw 'Exact live Node version required' }
          if ($manifest.nativeQa.rustToolchain -ne '1.97.1' -or $manifest.nativeQa.target -ne 'x86_64-pc-windows-msvc' -or $manifest.nativeQa.sdkVersion -ne '0.28.2') { throw 'Exact locked native toolchain/SDK scope required' }
          $requiredGroups = @{
            'wheel-target-admission' = @('platform-windows', 'input::mouse::wheel_target_admission_tests::')
            'set-value-native-readback' = @('platform-windows', 'tools::impl_::set_value_native_readback_tests::')
            'keyboard-production-dispatch-seam' = @('platform-windows', 'input::keyboard::keyboard_focus_witness_tests::')
            'value-write-readback' = @('platform-windows', 'tools::impl_::value_write_readback_tests::')
            'post-message-readback' = @('platform-windows', 'tools::impl_::post_message_readback_tests::')
            'windows-delivery-guidance' = @('platform-windows', 'input::delivery::tests::')
            'core-desktop-independent' = @('cua-driver-core', '')
            'sdk-abi' = @('cua-driver-sdk', 'abi::tests::')
          }
          if (@($manifest.nativeQa.unitGroups).Count -ne $requiredGroups.Count) { throw 'Every required unit group must be explicit' }
          foreach ($label in $requiredGroups.Keys) {
            $groups = @($manifest.nativeQa.unitGroups | Where-Object { $_.label -eq $label })
            if ($groups.Count -ne 1) { throw "Unique required test group missing: $label" }
            $group = $groups[0]
            if ($group.package -ne $requiredGroups[$label][0] -or $group.filter -ne $requiredGroups[$label][1]) { throw "Wrong required group selector: $label" }
            if (($group.expected -isnot [int64] -and $group.expected -isnot [int32]) -or $group.expected -lt 1) { throw "Exact positive count required: $label" }
          }
          $requiredFixtures = @{
            'owned-native-focus-admission' = 'uia::cache::keyboard_focus_owned_fixture_tests::'
            'owned-native-key-consumption' = 'tools::impl_::keyboard_owned_key_consumption_tests::'
          }
          if (@($manifest.nativeQa.ownedFixtures).Count -ne 2) { throw 'Both separately scoped ignored owned fixtures are required' }
          foreach ($label in $requiredFixtures.Keys) {
            $fixtures = @($manifest.nativeQa.ownedFixtures | Where-Object { $_.label -eq $label })
            if ($fixtures.Count -ne 1 -or $fixtures[0].filter -ne $requiredFixtures[$label] -or $fixtures[0].expected -ne 1) { throw "One exact ignored owned fixture required: $label" }
          }
          & git cat-file -e "$base^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Base commit missing; candidate must directly descend from exact public base' }
          & git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate does not descend from expected base' }
          $sourcePaths = @(
            'libs/cua-driver/rust/crates/platform-windows/src/input/keyboard.rs',
            'libs/cua-driver/rust/crates/platform-windows/src/input/mouse.rs',
            'libs/cua-driver/rust/crates/platform-windows/src/tools/impl_.rs',
            'libs/cua-driver/rust/crates/platform-windows/src/uia/cache.rs'
          )
          $allowed = $sourcePaths + @($manifestPath, '.github/workflows/issue344-keyboard-native-qa.yml')
          $changed = @(& git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source changes' }
          foreach ($path in $changed) {
            if ($path -notin $allowed) { throw "Out-of-scope candidate file: $path" }
          }
          if (@($manifest.files).Count -ne 4) { throw 'Exactly four final causal source records required' }
          foreach ($path in $sourcePaths) {
            if ($path -notin $changed) { throw "Expected causal source change missing: $path" }
            $entries = @($manifest.files | Where-Object { $_.path -eq $path })
            if ($entries.Count -ne 1) { throw "Unique manifest record required: $path" }
            $entry = $entries[0]
            if ($entry.candidateSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Final source hash required' }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $entry.candidateSha256) {
              & git ls-files --eol -- $path
              throw "Candidate source hash mismatch: $path; expected $($entry.candidateSha256); actual $actual"
            }
          }
          & git diff --check $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed' }
          $sessionId = (Get-Process -Id $PID).SessionId
          $sourceSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          $scope = [ordered]@{
            sourceCommit = $sourceSha
            publicBaseCommit = $base
            priorCausalPatchSha256 = $manifest.baseCandidatePatchSha256
            keyboardWitnessPatchSha256 = $manifest.keyboardWitnessPatchSha256
            authorManifestSha256 = $manifest.authorManifestSha256
            finalSourceFiles = $manifest.files
            changedFiles = $changed
            expectedPriorHelperTests = 13
            requiredUnitGroups = $manifest.nativeQa.unitGroups
            requiredOwnedFixtures = $manifest.nativeQa.ownedFixtures
            requiredNodeVersion = $manifest.nativeQa.nodeVersion
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            windowsSessionId = $sessionId
            sessionZero = ($sessionId -eq 0)
            nativeTestScope = 'Compiled MSVC Rust tests; production-dispatch seam unit tests use fake native/UIA/insertion callbacks'
            ownedFixtureScope = 'Separate owned real-focus/fake-insertion and actual Home/ShiftEnd/Unicode key-consumption fixtures; no customer Excel'
            ownedFixtureAcceptance = 'not_yet_performed_at_manifest_stage'
            interactiveValidation = 'customer_Excel_input_not_performed; owned_focus_fixture_recorded_separately'
            uiAcceptance = 'pending_separate_authenticated_desktop_fixture'
            capture = 'not_performed'
            input = 'customer_input_not_performed; actual_input_planned_only_on_exclusive_owned_CI_fixture'
            customerData = 'none'
            separateComBorrowPatch = 'excluded_by_changed_file_allowlist'
          }
          $scope | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $out 'source-and-scope.json')
          Copy-Item $manifestPath (Join-Path $out 'final-source-manifest.json')
          "Session ID: $sessionId. Interactive UI/capture/input acceptance is NOT performed by this job."
          "CARGO_HOME=$(Join-Path $env:RUNNER_TEMP 'issue344-cargo')" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'issue344-target')" >> $env:GITHUB_ENV

      - name: Install exact live Node version without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # primary OpenClaw v7.0.0 pin
        with:
          node-version: '24.19.0'
          check-latest: false
          package-manager-cache: false

      - name: Install exact official Rust toolchain and MSVC target
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain install failed' }
          $targets = @(& rustup target list --installed --toolchain 1.97.1)
          if ($LASTEXITCODE -ne 0 -or 'x86_64-pc-windows-msvc' -notin $targets) { throw 'MSVC std target unavailable' }
          $out = Join-Path $env:RUNNER_TEMP $env:QA_ARTIFACT_REL
          & node -e "if (process.version !== 'v24.19.0' || process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Exact live Node24/Windows x64 check failed' }
          $versions = [ordered]@{
            rustc = (& rustc +1.97.1 --version | Out-String).Trim()
            cargo = (& cargo +1.97.1 --version | Out-String).Trim()
            rustTarget = 'x86_64-pc-windows-msvc'
            installedRustTargets = $targets
            node = (& node --version | Out-String).Trim()
            npm = (& npm --version | Out-String).Trim()
            nodeRuntime = ((& node -p 'JSON.stringify({node:process.version,abi:process.versions.modules,napi:process.versions.napi,platform:process.platform,arch:process.arch})') | ConvertFrom-Json)
          }
          $versions | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out 'toolchain.json')
          $sourcePaths = @(
            'libs/cua-driver/rust/crates/platform-windows/src/input/keyboard.rs',
            'libs/cua-driver/rust/crates/platform-windows/src/input/mouse.rs',
            'libs/cua-driver/rust/crates/platform-windows/src/tools/impl_.rs',
            'libs/cua-driver/rust/crates/platform-windows/src/uia/cache.rs'
          )
          & rustfmt +1.97.1 --edition 2021 --check @sourcePaths
          if ($LASTEXITCODE -ne 0) { throw 'Changed Rust source formatting failed' }

      - name: Native MSVC compile and selected production-path regressions
        working-directory: libs/cua-driver/rust
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP $env:QA_ARTIFACT_REL
          $results = [System.Collections.Generic.List[object]]::new()
          function Invoke-CargoLogged([string]$Label, [string[]]$CargoArguments) {
            $logPath = Join-Path $out "$Label.log"
            $previousPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & cargo +1.97.1 @CargoArguments 2>&1 | Tee-Object -FilePath $logPath | ForEach-Object { Write-Host "$_" }
              $code = $LASTEXITCODE
            } finally { $ErrorActionPreference = $previousPreference }
            if ($code -ne 0) { throw "$Label failed with exit $code" }
            return $logPath
          }
          function Invoke-SelectedTests([object]$Group) {
            $Label = [string]$Group.label
            $Expected = [int]$Group.expected
            $testArgs = @('test', '-p', [string]$Group.package, '--lib', '--target', 'x86_64-pc-windows-msvc', '--locked')
            if ($Group.filter) { $testArgs += [string]$Group.filter }
            $listLog = Invoke-CargoLogged "$Label-list" ($testArgs + @('--', '--list'))
            $listed = @(Get-Content $listLog | Where-Object { $_ -match ': test$' }).Count
            if ($listed -ne $Expected) { throw "$Label expected exactly $Expected listed tests, got $listed" }
            $runLog = Invoke-CargoLogged "$Label-run" ($testArgs + @('--', '--test-threads=1'))
            $summary = [regex]::Match((Get-Content -Raw $runLog), 'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;')
            if (-not $summary.Success) { throw "$Label has no passing test summary" }
            $passed = [int]$summary.Groups[1].Value
            $failed = [int]$summary.Groups[2].Value
            $ignored = [int]$summary.Groups[3].Value
            if ($passed -ne $Expected -or $failed -ne 0 -or $ignored -ne 0) { throw "$Label did not execute exactly every required selected test" }
            $results.Add([ordered]@{ label=$Label; package=$Group.package; filter=$Group.filter; expected=$Expected; listed=$listed; passed=$passed; failed=$failed; ignored=$ignored; scope='unit_or_ABI_not_field_consumption' })
            $results | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $out 'native-unit-test-results.json')
          }
          $null = Invoke-CargoLogged 'native-msvc-compile-tests' @(
            'test', '-p', 'platform-windows', '-p', 'cua-driver-core', '-p', 'cua-driver-sdk',
            '--tests', '--no-run', '--locked', '--target', 'x86_64-pc-windows-msvc'
          )
          $scope = Get-Content -Raw (Join-Path $out 'source-and-scope.json') | ConvertFrom-Json
          foreach ($group in $scope.requiredUnitGroups) { Invoke-SelectedTests $group }
          $prior = @($results | Where-Object { $_.label -in @('wheel-target-admission', 'set-value-native-readback') } | Measure-Object -Property passed -Sum)
          if ($prior[0].Sum -ne 13) { throw 'Prior frozen helper count changed' }

      - name: Run both explicitly ignored owned native fixtures with separate scopes
        working-directory: libs/cua-driver/rust
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP $env:QA_ARTIFACT_REL
          $scope = Get-Content -Raw (Join-Path $out 'source-and-scope.json') | ConvertFrom-Json
          $sessionId = (Get-Process -Id $PID).SessionId
          $fixtureResults = foreach ($fixture in $scope.requiredOwnedFixtures) {
            $isActualKeyFixture = $fixture.label -eq 'owned-native-key-consumption'
            [ordered]@{
              label=$fixture.label; status='not_started'; filter=$fixture.filter; expected=1; listed=0; passed=0; failed=0; ignored=0
              windowsSessionId=$sessionId; sessionZero=($sessionId -eq 0)
              scope=$(if ($isActualKeyFixture) { 'actual_existing_Home_ShiftEnd_SendInput_full_EM_GETSEL_selection_then_one_Unicode_replacement_on_owned_Edit' } else { 'real_owned_Win32_UIA_focus_with_fake_insertion_counter_only' })
              actualSendInput=$false; fieldConsumption=$false; inputOutcome='not_attempted'; customerExcelAcceptance='not_performed'; customerData='none'
            }
          }
          function Save-FixtureResults {
            @($fixtureResults) | ConvertTo-Json -Depth 5 -AsArray | Set-Content -Encoding utf8 (Join-Path $out 'owned-native-fixture-results.json')
          }
          function Invoke-FixtureCargo([string]$Label, [string[]]$CargoArguments) {
            $logPath = Join-Path $out "$Label.log"
            $ErrorActionPreference = 'Continue'
            & cargo +1.97.1 @CargoArguments 2>&1 | Tee-Object -FilePath $logPath | ForEach-Object { Write-Host "$_" }
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($code -ne 0) { throw "$Label failed with exit $code" }
            return $logPath
          }
          Save-FixtureResults
          foreach ($result in $fixtureResults) {
            $isActualKeyFixture = $result.label -eq 'owned-native-key-consumption'
            try {
              if ($sessionId -eq 0) {
                $result.status = 'blocked_session_zero'
                throw 'Owned fixtures require an actual exclusive interactive Windows desktop; Session 0 is not acceptance'
              }
              $fixtureCargoArgs = @('test', '-p', 'platform-windows', '--lib', '--locked', '--target', 'x86_64-pc-windows-msvc', [string]$result.filter)
              $list = Invoke-FixtureCargo ($result.label + '-ignored-list') ($fixtureCargoArgs + @('--', '--ignored', '--list'))
              $result.listed = @(Get-Content $list | Where-Object { $_ -match ': test$' }).Count
              if ($result.listed -ne 1) { throw 'Expected exactly one explicitly ignored test in each owned fixture group' }
              if ($isActualKeyFixture) {
                $result.inputOutcome = 'may_have_been_attempted_pending_test_summary'
                $result.actualSendInput = $null
                $result.fieldConsumption = $null
                Save-FixtureResults
              }
              $log = Invoke-FixtureCargo ($result.label + '-run') ($fixtureCargoArgs + @('--', '--ignored', '--test-threads=1'))
              $summary = [regex]::Match((Get-Content -Raw $log), 'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;')
              if (-not $summary.Success) { throw 'Owned fixture has no passing summary' }
              $result.passed = [int]$summary.Groups[1].Value
              $result.failed = [int]$summary.Groups[2].Value
              $result.ignored = [int]$summary.Groups[3].Value
              if ($result.passed -ne 1 -or $result.failed -ne 0 -or $result.ignored -ne 0) { throw 'Owned fixture did not run exactly once' }
              $result.status = $(if ($isActualKeyFixture) { 'passed_actual_owned_Edit_key_consumption_only' } else { 'passed_owned_focus_fake_insertion_only' })
              $result.actualSendInput = $isActualKeyFixture
              $result.fieldConsumption = $isActualKeyFixture
              $result.inputOutcome = $(if ($isActualKeyFixture) { 'owned_fixture_selection_replacement_assertions_passed' } else { 'no_actual_input_fake_insertion_only' })
            } catch {
              if ($result.status -eq 'not_started') { $result.status = 'failed_owned_fixture_no_green_skip' }
              throw
            } finally { Save-FixtureResults }
          }
      - name: Build production-route MSVC SDK DLL release artifact only
        working-directory: libs/cua-driver/rust
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP $env:QA_ARTIFACT_REL
          & cargo +1.97.1 build --locked -p cua-driver-sdk --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath (Join-Path $out 'native-msvc-release-build.log')
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -ne 0) { throw "Release build failed with exit $code" }
          $release = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release'
          $artifactDir = Join-Path $out 'unsigned-native-build'
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          $hashes = foreach ($name in @('cua_driver_sdk.dll')) {
            $path = Join-Path $release $name
            if (-not (Test-Path $path)) { throw "Expected native artifact missing: $name" }
            Copy-Item $path (Join-Path $artifactDir $name)
            [ordered]@{ name=$name; sha256=(Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant(); bytes=(Get-Item $path).Length }
          }
          @($hashes) | ConvertTo-Json -Depth 4 -AsArray | Set-Content -Encoding utf8 (Join-Path $out 'native-artifact-hashes.json')

      - name: Official npm 0.28.2 baseline and candidate SDK import/checksum smoke only
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP $env:QA_ARTIFACT_REL
          $smoke = Join-Path $env:RUNNER_TEMP 'issue344-npm-smoke'
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Set-Content -Encoding ascii (Join-Path $smoke '.npmrc') 'registry=https://registry.npmjs.org/'
          $env:NPM_CONFIG_USERCONFIG = Join-Path $smoke '.npmrc'
          Push-Location $smoke
          try {
            & npm init --yes 2>&1 | Tee-Object -FilePath (Join-Path $out 'npm-init.log')
            if ($LASTEXITCODE -ne 0) { throw 'Isolated npm package init failed' }
            & npm install --ignore-scripts --no-audit --no-fund --save-exact --registry=https://registry.npmjs.org/ '@trycua/cua-driver@0.28.2' '@trycua/cua-driver-win32-x64-msvc@0.28.2' 2>&1 | Tee-Object -FilePath (Join-Path $out 'npm-install.log')
            if ($LASTEXITCODE -ne 0) { throw 'Official npm 0.28.2 package install failed' }
            $nodeScript = @'
          import assert from 'node:assert/strict';
          import { readFileSync, existsSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { resolve, join } from 'node:path';
          const [phase, resultPath, expectedDllHash] = process.argv.slice(2);
          assert.equal(process.platform, 'win32');
          assert.equal(process.arch, 'x64');
          assert.equal(process.version, 'v24.19.0');
          const nativeDir = resolve('node_modules/@trycua/cua-driver-win32-x64-msvc');
          const publicDir = resolve('node_modules/@trycua/cua-driver');
          const nativePackage = JSON.parse(readFileSync(join(nativeDir, 'package.json'), 'utf8'));
          const publicPackage = JSON.parse(readFileSync(join(publicDir, 'package.json'), 'utf8'));
          assert.equal(nativePackage.version, '0.28.2');
          assert.equal(publicPackage.version, '0.28.2');
          const digest = (file) => createHash('sha256').update(readFileSync(file)).digest('hex');
          const dll = join(nativeDir, 'cua_driver_sdk.dll');
          const addon = join(nativeDir, 'cua_driver_node_runtime.node');
          assert(existsSync(dll) && existsSync(addon));
          const dllHash = digest(dll);
          if (expectedDllHash !== '-') assert.equal(dllHash, expectedDllHash);
          // Official native/index initializes both generated components at import,
          // opening the adjacent DLL and checking UniFFI contract and API checksums.
          // No CuaDriver constructor or OS action is invoked by this smoke.
          const api = await import('@trycua/cua-driver');
          assert.equal(typeof api.CuaDriver, 'function');
          assert.equal(typeof api.CuaDriver.createWithClientKind, 'function');
          const result = {
            phase, importVerified: true, packageVersion: publicPackage.version,
            nodeVersion: process.version, nodeAbi: process.versions.modules,
            napiVersion: process.versions.napi, sdkDllSha256: dllHash,
            officialNodeAddonSha256: digest(addon),
            ffiInitialization: 'official_generated_contract_and_checksum_initialization',
            driverConstructed: false, sessionCreated: false, capture: false, input: false,
            interactiveAcceptance: 'not_performed'
          };
          writeFileSync(resultPath, JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          '@
            Set-Content -Encoding utf8 (Join-Path $smoke 'import-smoke.mjs') $nodeScript
            & node (Join-Path $smoke 'import-smoke.mjs') 'official-baseline' (Join-Path $out 'npm-official-baseline-import.json') '-' 2>&1 | Tee-Object -FilePath (Join-Path $out 'npm-official-baseline-import.log')
            if ($LASTEXITCODE -ne 0) { throw 'Official native SDK baseline import failed' }
            $nativeDir = Join-Path $smoke 'node_modules/@trycua/cua-driver-win32-x64-msvc'
            $officialAddon = Join-Path $nativeDir 'cua_driver_node_runtime.node'
            $addonBefore = (Get-FileHash -Algorithm SHA256 $officialAddon).Hash.ToLowerInvariant()
            $candidateDll = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release/cua_driver_sdk.dll'
            $expectedDllHash = (Get-FileHash -Algorithm SHA256 $candidateDll).Hash.ToLowerInvariant()
            Copy-Item $candidateDll (Join-Path $nativeDir 'cua_driver_sdk.dll') -Force
            # Fresh Node process avoids returning an already-loaded official DLL.
            & node (Join-Path $smoke 'import-smoke.mjs') 'candidate-adjacent-sdk' (Join-Path $out 'npm-candidate-sdk-import.json') $expectedDllHash 2>&1 | Tee-Object -FilePath (Join-Path $out 'npm-candidate-sdk-import.log')
            if ($LASTEXITCODE -ne 0) { throw 'Candidate SDK/official Node addon import failed' }
            if ((Get-FileHash -Algorithm SHA256 $officialAddon).Hash.ToLowerInvariant() -ne $addonBefore) { throw 'Official Node addon changed unexpectedly' }
            Copy-Item (Join-Path $smoke 'package-lock.json') (Join-Path $out 'official-npm-package-lock.json')
          } finally { Pop-Location }

      - name: Record final QA boundary in run summary
        if: always()
        run: |
          $out = Join-Path $env:RUNNER_TEMP $env:QA_ARTIFACT_REL
          @(
            '## Issue344 native compile/SDK QA only',
            '',
            'This job does not prove Dell Excel set_value, wheel targeting, full-selection keyboard behavior, UIA provider behavior, or authenticated customer desktop acceptance.',
            'Native MSVC compilation, exact-count unit/ABI tests and fresh official/candidate SDK imports under pinned Node24.19.0 are separately recorded.',
            'The keyboard production-dispatch seam tests use fake native/UIA/insertion callbacks, not real key or field consumption.',
            'Both ignored owned GUI fixtures are explicitly required: real-focus/fake-insertion and actual standard key selection/replacement on a synthetic owned Edit.',
            'Their scopes and results are distinct. Owned Edit consumption is not Dell Excel acceptance; Session0, no GUI, held modifiers or fixture failure cannot become a passing skip.',
            'Session 0 is a required fixture failure. No capture or customer input occurs, and no GUI skip is labeled acceptance.',
            'Only the unsigned production-route SDK DLL is built; CLI/UIAccess binaries are not rebuilt. No production deployment or live DLL replacement occurs.'
          ) | Set-Content -Encoding utf8 (Join-Path $out 'QA-BOUNDARY.md')
          Get-Content (Join-Path $out 'QA-BOUNDARY.md') >> $env:GITHUB_STEP_SUMMARY

      - name: Upload native QA logs, provenance and unsigned test artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # upstream v4 pin
        with:
          name: issue344-keyboard-native-msvc-qa-${{ github.sha }}
          path: ${{ runner.temp }}/issue344-keyboard-native-qa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
