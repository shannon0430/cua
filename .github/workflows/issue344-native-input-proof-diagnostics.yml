              failed=expected-passed
              assert (scope['matrixExitCode']==0) == (not failed)
              rows=[]; current=None; begun=[]; ended=[]
              for line in log_text.splitlines():
                  for marker in ['CUA_NATIVE_INPUT_PROOF_CASE_V1 ', 'CUA_NATIVE_INPUT_PROOF_DIAGNOSTIC_V1 ', 'CUA_NATIVE_INPUT_PROOF_DIAGNOSTIC_V2 ']:
                      if marker not in line: continue
                      value=line.split(marker,1)[1]
                      assert len((marker+value+'\n').encode()) <= 16384
                      item=closed_json(value)
                      if marker.startswith('CUA_NATIVE_INPUT_PROOF_CASE'):
                          assert set(item)=={'cellId','phase'} and item['cellId'] in expected
                          if item['phase']=='begin':
                              assert current is None; current=item['cellId']; begun.append(current)
                          else:
                              assert item['phase']=='end' and item['cellId']==current
                              ended.append(current); current=None
                      else:
                          assert current in expected
