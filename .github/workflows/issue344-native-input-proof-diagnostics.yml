name: Issue344 four owned-fixture native proof diagnostics only

on:
  push:
    branches: [source/issue344-native-proof-diag-20261010]

permissions:
  contents: read

concurrency:
  group: issue344-native-proof-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  four-owned-cases:
    if: github.repository == 'shannon0430/cua' && github.ref == 'refs/heads/source/issue344-native-proof-diag-20261010'
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '4'
      RUST_BACKTRACE: '0'
      CUA_DRIVER_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Preserve exact LF source bytes
        run: |
          & git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve exact source bytes' }
          & git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve LF source bytes' }
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32
          persist-credentials: false
      - name: Verify exact source and LF materialization
        run: |
          $ErrorActionPreference = 'Stop'
          & git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot pin checkout byte policy' }
          & git config --local core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot pin LF checkout policy' }
          & git checkout-index --force --all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot materialize exact LF checkout' }
          & git merge-base --is-ancestor a80258ee1ff1e1b38ca87eb571f4552c3b853c54 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic source must descend from exact a802 runtime' }
          $source = (& git rev-parse HEAD).Trim()
          if ($source -ne $env:GITHUB_SHA) { throw 'Exact diagnostic source mismatch' }
      - name: Verify closed nine-path source against exact Git blobs
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          base='a80258ee1ff1e1b38ca87eb571f4552c3b853c54'
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['GITHUB_SHA']
          paths=sorted([
              '.github/workflows/issue344-native-input-proof-diagnostics.yml',
              'libs/cua-driver/docs/foreground-target-ownership.md',
              'libs/cua-driver/rust/crates/cua-driver/Cargo.toml',
              'libs/cua-driver/rust/crates/cua-driver/tests/cross_platform_behavior_test.rs',
              'libs/cua-driver/rust/crates/platform-windows/Cargo.toml',
              'libs/cua-driver/rust/crates/platform-windows/src/input/keyboard.rs',
              'libs/cua-driver/rust/crates/platform-windows/src/input/mod.rs',
              'libs/cua-driver/rust/crates/platform-windows/src/input/mouse.rs',
              'libs/cua-driver/rust/crates/platform-windows/src/input/proof_diagnostics.rs',
          ])
          changed=sorted(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed==paths, 'Exact nine-path source closure required'
          preserved=[
              'libs/cua-driver/rust/crates/platform-windows/src/uia/cache.rs',
              'scripts/ci/windows/run-rust-e2e.ps1',
              '.github/workflows/e2e-rust-windows.yml',
              'libs/cua-driver/rust/Cargo.lock',
          ]
          # Independent fixed postimages; workflow bytes bind to their exact Git blob, not to a self-referential digest.
          pinned_sha256={".github/workflows/e2e-rust-windows.yml": "24ecf598714b12e015a2806cb034db19d32bf7030640ee6243023837583f2c49", "libs/cua-driver/docs/foreground-target-ownership.md": "d1a05431b453f4cc4d8824de73934d031b34b5f66100640a1e02c79605cd2af9", "libs/cua-driver/rust/Cargo.lock": "fe2ece2843bd07ebdcdab67a44b34c89868a4c6e96fd326c80fd3b9aa0ba9a39", "libs/cua-driver/rust/crates/cua-driver/Cargo.toml": "0c9e0dfdb2acd8e73e052c68c7e99c376fc7aae1081670b1715030f4e5d143cd", "libs/cua-driver/rust/crates/cua-driver/tests/cross_platform_behavior_test.rs": "f55d482d61e5fc8da5909f96f273d89605e54d8c3b36c529cffa677836c07857", "libs/cua-driver/rust/crates/platform-windows/Cargo.toml": "4e66328c1468a542d90940a91668d957a738c21414134dfd213c22d98e05094a", "libs/cua-driver/rust/crates/platform-windows/src/input/keyboard.rs": "f90ed1dad84cd33f9f913b5d75c2bc2faa32a019de1e946525561e4c957f5121", "libs/cua-driver/rust/crates/platform-windows/src/input/mod.rs": "a8440a003d52adbd5f15a88b04ac4bb34401ef838466ae6007115ee61b927246", "libs/cua-driver/rust/crates/platform-windows/src/input/mouse.rs": "b55e76aeb1613f1c47b46bbb548be5be8fc5f9d2e8e624012a793ec826535ba5", "libs/cua-driver/rust/crates/platform-windows/src/input/proof_diagnostics.rs": "10732ae01db247db79d2b3a83cc52687e0e8013014bd70ab93af0d46e081908d", "libs/cua-driver/rust/crates/platform-windows/src/uia/cache.rs": "f73d5e3fd816b26d637e1970c662f3375a8d399a210e159735e3ffb898613d44", "scripts/ci/windows/run-rust-e2e.ps1": "e77dd5937b63176f4705b8a0b8ddefd2a814227eff6a299b2adfd24d49b7d795"}
          assert len(pinned_sha256)==12
          rows=[]
          for path in paths+preserved:
              blob=subprocess.check_output(['git','show',source+':'+path])
              if path in preserved:
                  assert blob==subprocess.check_output(['git','show',base+':'+path])
              p=pathlib.Path(path)
              prior_matches=p.read_bytes()==blob
              p.write_bytes(blob) # Explicit binary rematerialization: no PowerShell CRLF conversion.
              actual=p.read_bytes()
              assert actual==blob and b'\r\n' not in actual, 'Exact LF source blob required'
              if path in pinned_sha256: assert hashlib.sha256(actual).hexdigest()==pinned_sha256[path], 'Fixed reviewed source postimage required'
              oid=subprocess.check_output(['git','rev-parse',source+':'+path],text=True).strip()
              rows.append({'path':path,'sha256':hashlib.sha256(actual).hexdigest(),'bytes':len(actual),'gitBlobOid':oid,'priorCheckoutMatchedBlob':prior_matches,'rematerializedFromExactGitBlob':True,'runtimeContractUnchanged':path in preserved})
          subprocess.check_call(['git','diff','--check',base,'HEAD'])
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue344-native-proof-diagnostics'
          out.mkdir(exist_ok=True)
          (out/'source-byte-binding.json').write_text(json.dumps({'sourceCommit':source,'baseRuntime':base,'closedChangedSourcePaths':paths,'actualSourceFiles':rows,'canonicalAllAccepted':False,'packageAccepted':False,'dellExcelAccepted':False},indent=2)+'\n',encoding='utf-8')
      - name: Verify interactive owning desktop and exact MSVC toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\ci\windows\verify-user-session.ps1
          if (-not $?) { throw 'Interactive desktop required; no GUI skip' }
          & .\scripts\ci\windows\setup-ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Canonical trajectory tooling required' }
          & rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MSVC toolchain required' }
          & rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select pinned toolchain' }
          $hostInfo = (& rustc +1.97.1 -vV) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $hostInfo -notmatch 'host: x86_64-pc-windows-msvc') { throw 'Actual MSVC host required' }
      - name: Run normal native units and verify every new parent test actually passed
        working-directory: libs/cua-driver/rust
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'issue344-native-proof-diagnostics'
          $ErrorActionPreference = 'Continue'
          $unitOutput = @(& cargo +1.97.1 test --locked -p platform-windows --lib -- --test-threads=1 2>&1)
          $unitExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $unitText = ($unitOutput | ForEach-Object { $_.ToString() }) -join "`n"
          $unitOutput | Write-Host
          $unitText | Set-Content -Encoding utf8 (Join-Path $out 'native-unit-tests.log')
          $summary = [regex]::Match($unitText, 'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored;')
          if ($unitExit -ne 0 -or -not $summary.Success) { throw 'Normal native unit suite failed' }
          $requiredTests = @(
            'input::keyboard::virtual_key_scope_tests::virtual_immediate_root_parent_correlates_once_without_wire_expansion',
            'input::keyboard::virtual_key_scope_tests::virtual_immediate_nonroot_parent_correlates_once',
            'input::keyboard::virtual_key_scope_tests::virtual_parent_sibling_and_nonimmediate_root_focus_never_send',
            'input::keyboard::virtual_key_scope_tests::virtual_parent_focus_owner_or_thread_mismatch_never_sends',
            'input::keyboard::virtual_key_scope_tests::virtual_parent_semantic_focus_mismatch_or_missing_scope_never_sends',
            'input::keyboard::virtual_key_scope_tests::virtual_parent_direct_native_root_anchor_and_native_leaf_never_send',
            'input::keyboard::virtual_key_scope_tests::virtual_parent_anchor_identity_or_parent_drift_never_sends',
            'input::keyboard::virtual_key_scope_tests::virtual_parent_final_foreground_active_focus_or_owner_drift_never_sends',
            'input::mouse::virtual_wheel_ownership_tests::virtual_wheel_immediate_root_parent_correlates_once',
            'input::mouse::virtual_wheel_ownership_tests::virtual_wheel_immediate_nonroot_parent_correlates_once',
            'input::mouse::virtual_wheel_ownership_tests::virtual_wheel_parent_sibling_and_nonimmediate_root_focus_never_send',
            'input::mouse::virtual_wheel_ownership_tests::virtual_wheel_parent_focus_owner_or_thread_mismatch_never_sends',
            'input::mouse::virtual_wheel_ownership_tests::virtual_wheel_parent_hover_or_scope_identity_drift_never_sends',
            'input::mouse::virtual_wheel_ownership_tests::virtual_wheel_parent_direct_native_root_anchor_and_native_leaf_never_send',
            'input::mouse::virtual_wheel_ownership_tests::virtual_wheel_parent_final_focus_pid_thread_or_foreground_drift_never_sends'
          )
          foreach ($test in $requiredTests) {
            $pattern = '(?m)^test ' + [regex]::Escape($test) + ' \.\.\. ok\r?$'
            if ([regex]::Matches($unitText, $pattern).Count -ne 1) { throw 'Required parent test absent, duplicated or ignored' }
          }
          [ordered]@{ sourceCommit=$env:GITHUB_SHA; normalPassed=[int]$summary.Groups[1].Value; normalIgnored=[int]$summary.Groups[2].Value; requiredParentTests=$requiredTests; requiredParentPassed=$requiredTests.Count; requiredParentIgnored=0; nativeUnitsAccepted=$true; canonicalAllAccepted=$false; dellExcelAccepted=$false } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $out 'native-unit-verification.json')
          foreach ($fixture in @('uia::cache::keyboard_focus_owned_fixture_tests::owned_two_edit_exact_uia_and_gui_focus_positive_negative', 'tools::impl_::keyboard_owned_key_consumption_tests::owned_edit_home_shift_end_then_one_unicode_replacement')) {
            $ErrorActionPreference = 'Continue'
            $fixtureOutput = @(& cargo +1.97.1 test --locked -p platform-windows --lib $fixture -- --ignored --exact --nocapture --test-threads=1 2>&1)
            $fixtureExit = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            $fixtureText = ($fixtureOutput | ForEach-Object { $_.ToString() }) -join "`n"
            $fixtureOutput | Write-Host
            if ($fixtureExit -ne 0 -or $fixtureText -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw 'Existing owned native GUI fixture did not run and pass exactly once' }
          }
      - name: Compile native source and exercise bounded encoder only
        working-directory: libs/cua-driver/rust
        run: |
          & cargo +1.97.1 test --locked -p platform-windows --features native-input-proof-diagnostics --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Native production/test source did not compile' }
          $testOutput = @(& cargo +1.97.1 test --locked -p platform-windows --features native-input-proof-diagnostics --lib input::proof_diagnostics::tests:: -- --test-threads=1 2>&1)
          $testExit = $LASTEXITCODE
          $testText = ($testOutput | ForEach-Object { $_.ToString() }) -join "`n"
          $testOutput | Write-Host
          $out = Join-Path $env:RUNNER_TEMP 'issue344-native-proof-diagnostics'
          $testText | Set-Content -Encoding utf8 (Join-Path $out 'native-encoder-tests.log')
          if ($testExit -ne 0 -or $testText -notmatch 'test result: ok\. 12 passed; 0 failed; 0 ignored;') { throw 'Exactly twelve bounded encoder tests required, preserving the original eight' }
          $lateTest = 'input::keyboard::keyboard_focus_witness_tests::late_tuple_each_field_drift_refuses_with_zero_sender_calls'
          $lateOutput = @(& cargo +1.97.1 test --locked -p platform-windows --features native-input-proof-diagnostics --lib $lateTest -- --exact --test-threads=1 2>&1)
          $lateExit = $LASTEXITCODE
          $lateText = ($lateOutput | ForEach-Object { $_.ToString() }) -join "`n"
          $lateOutput | Write-Host
          $lateText | Set-Content -Encoding utf8 (Join-Path $out 'late-tuple-dispatch-tests.log')
          if ($lateExit -ne 0 -or $lateText -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw 'Late tuple drift must refuse in the production seam without sender calls' }
          & cargo +1.97.1 build --locked --release -p cua-driver --features native-input-proof-diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic CLI build failed' }
      - name: Build existing synthetic owning fixtures
        run: |
          & .\scripts\ci\windows\build-harnesses.ps1 -Targets @('electron', 'tauri', 'webview')
          if ($LASTEXITCODE -ne 0) { throw 'Owning fixture build failed' }
      - name: Run unchanged four required deliver cases with RequireGui and zero skips
        working-directory: libs/cua-driver/rust
        run: |
          $ErrorActionPreference = 'Stop'
          $rust = (Get-Location).Path
          $out = Join-Path $env:RUNNER_TEMP 'issue344-native-proof-diagnostics'
          New-Item -ItemType Directory -Force $out | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $out 'recordings') | Out-Null
          $env:CUA_TEST_WORKSPACE_ROOT = $rust
          $env:CUA_TEST_APPS_ROOT = Join-Path $rust 'test-apps'
          $env:CUA_TEST_DRIVER_BIN = Join-Path $rust 'target/release/cua-driver.exe'
          $env:CUA_TEST_DRIVER_STDERR = '1'
          $env:CUA_TEST_REQUIRE_FIXTURES = '1'
          $env:CUA_REQUIRE_GUI = '1'
          $env:CUA_E2E_FORBID_SKIPS = '1'
          $env:CUA_E2E_UNRESTRICTED_GUI = '1'
          $env:CUA_E2E_SOURCE_SHA = $env:GITHUB_SHA
          $env:CUA_DRIVER_SOURCE_SHA = $env:GITHUB_SHA
          $env:CUA_E2E_EXPECTED_MIN_CELLS = '4'
          $env:CUA_E2E_CELL_FILTER = 'windows-electron-scroll-px-foreground,windows-tauri-type-submit-ax-foreground,windows-tauri-press-key-ax-foreground,windows-tauri-scroll-px-foreground'
          $env:CUA_E2E_DECLARATIONS_FILE = Join-Path $out 'cases.jsonl'
          $env:CUA_E2E_ENVIRONMENT_FILE = Join-Path $out 'environment.jsonl'
          $env:CUA_E2E_RESULTS_FILE = Join-Path $out 'results.jsonl'
          $env:CUA_E2E_RECORDINGS_ROOT = Join-Path $out 'recordings'
          foreach ($name in @('cases.jsonl', 'environment.jsonl', 'results.jsonl')) {
            New-Item -ItemType File (Join-Path $out $name) | Out-Null
          }
          # Use the existing canonical desktop/UIA/capture/video preflight unchanged.
          # Its log is separate: only the four cell-bound refusal records are collected.
          $ErrorActionPreference = 'Continue'
          & cargo +1.97.1 test --locked -p cua-driver --features native-input-proof-diagnostics --test e2e_environment_preflight_test -- --ignored --exact canonical_e2e_environment_is_ready --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $out 'environment-preflight.log')
          $preflightExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($preflightExit -ne 0) { throw 'Canonical owning environment preflight failed; no four-cell input matrix' }
          $ErrorActionPreference = 'Continue'
          & cargo +1.97.1 test --locked -p cua-driver --features native-input-proof-diagnostics --test cross_platform_behavior_test -- --ignored --exact shared_web_action_matrix_is_state_verified --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath (Join-Path $out 'four-case-original-harness.log')
          $matrixExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          [ordered]@{ sourceCommit=$env:GITHUB_SHA; baseRuntime='a80258ee1ff1e1b38ca87eb571f4552c3b853c54'; matrixExitCode=$matrixExit; scope='diagnostic_four_owned_cases_only'; canonicalAllAccepted=$false; packageAccepted=$false; dellExcelAccepted=$false } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out 'scope.json')
          if ($matrixExit -ne 0) { throw "Original effect oracle failed ($matrixExit); diagnostic collection does not convert failure to success" }
      - name: Preserve exact source-bound normal-form refusal diagnostics
        if: always()
        shell: python
        run: |
          import copy, json, os, pathlib
          expected={'windows-electron-scroll-px-foreground','windows-tauri-type-submit-ax-foreground','windows-tauri-press-key-ax-foreground','windows-tauri-scroll-px-foreground'}
          expected_ops={cell:('retained_key' if cell in {'windows-tauri-type-submit-ax-foreground','windows-tauri-press-key-ax-foreground'} else 'virtual_wheel') for cell in expected}
          allowed_keys=set('schema operation phase inputAttempted gate predicates aliases target root foreground active focus hover ownNative providerAnchor anchorParent scope virtualDocument windowless nonRootNativeAnchor providerPidPositive providerProcessClass anchorProcessClass anchorThreadClass additionalObservation matchesGateSnapshot traversalBoundary cursorMatchesGate status unavailable nodeBound depthBound cycle byteBound nodes alias parent processClass threadClass readable withinAdmittedRoot anchorIdentityMatches hoverWithinAnchor focusWithinAnchor refusalStage nativeSnapshotEquality targetThread targetPid foregroundThread focusThread focusPid nativeCorrelationAdmitted'.split())
          allowed_strings={'cua-native-input-proof-diagnostic/v1','retained_key','virtual_wheel','after_refusal','admittedRoot','complete','incomplete','cua-native-input-proof-diagnostic/v2','pre_uia_vs_final_native'}
          late_keys=set('refusalStage nativeSnapshotEquality targetThread targetPid foregroundThread focusThread focusPid nativeCorrelationAdmitted'.split())
          def closed_object(pairs):
              assert len(pairs)==len({key for key,_ in pairs}), 'Duplicate JSON key'
              return dict(pairs)
          def closed_json(value): return json.loads(value,object_pairs_hook=closed_object)
          def normal_form(value, depth=0, late=False):
              assert depth <= 8
              if isinstance(value,dict):
                  assert len(value)<=32 and set(value).issubset(allowed_keys if late else allowed_keys-late_keys)
                  for v in value.values(): normal_form(v,depth+1,late)
              elif isinstance(value,list):
                  assert len(value)<=64
                  for v in value: normal_form(v,depth+1,late)
              elif value is None or isinstance(value,bool): pass
              elif isinstance(value,int): assert 0<=value<128
              else: assert isinstance(value,str) and value in allowed_strings


          equality_keys={'target','targetThread','targetPid','root','foreground','foregroundThread','active','focus','focusThread','focusPid'}
          wire_keys=set('version nativeElementAdmitted elementReferenceKind uiaHasKeyboardFocus uiaFocusedElementEqualsTarget uiaProcessMatchesTarget nativeForegroundRelation nativeForegroundStable nativeGuiInfoAvailable nativeActiveWithinBoundary nativeFocusWithinBoundary nativeFocusStable nativeElementCorrelation inputAttempted insertedEventCount valueChangedOnFocus providerFailureCode failureCode'.split())
          def object_keys(value, keys):
              assert type(value) is dict and set(value)==set(keys)
          def alias(value, count=64):
              assert value is None or (type(value) is int and 0<=value<count)
          def validate_graph(gate, observation):
              # These references index the actual bounded node array, not a hypothetical
              # 64-slot graph. Validate incomplete graphs too, without promoting them.
              gate_keys=['target','root','foreground','active','focus','hover','ownNative','providerAnchor','anchorParent']
              post_keys=['foreground','active','focus','hover']
              object_keys(gate['aliases'],gate_keys)
              scope=gate['scope']
              object_keys(scope,{'virtualDocument','windowless','nonRootNativeAnchor','providerPidPositive','providerProcessClass','anchorProcessClass','anchorThreadClass'})
              for key,value in scope.items():
                  if key.endswith('Class'): assert type(value) is int and 0<=value<128
                  else: assert type(value) is bool
              object_keys(observation,{'matchesGateSnapshot','traversalBoundary','cursorMatchesGate','status','unavailable','nodeBound','depthBound','cycle','aliases','nodes'})
              assert observation['traversalBoundary']=='admittedRoot'
              assert observation['cursorMatchesGate'] is None or type(observation['cursorMatchesGate']) is bool
              for key in ['matchesGateSnapshot','unavailable','nodeBound','depthBound','cycle']: assert type(observation[key]) is bool
              assert observation['status'] in {'complete','incomplete'}
              object_keys(observation['aliases'],post_keys)
              nodes=observation['nodes']; assert type(nodes) is list and len(nodes)<=64
              count=len(nodes)
              for value in list(gate['aliases'].values())+list(observation['aliases'].values()): alias(value,count)
              root=gate['aliases']['root']
              # Classes are interned by the encoder: provider then anchor process,
              # anchor thread, then each node in order. A class outside that sequence
              # cannot be an anonymous equality class emitted by this encoder.
              assert scope['providerProcessClass']==0 and scope['anchorProcessClass'] in {0,1} and scope['anchorThreadClass']==0
              processes=list(dict.fromkeys([scope['providerProcessClass'],scope['anchorProcessClass']]))
              threads=[scope['anchorThreadClass']]
              for index,node in enumerate(nodes):
                  object_keys(node,{'alias','parent','root','processClass','threadClass','readable','withinAdmittedRoot'})
                  assert type(node['alias']) is int and node['alias']==index
                  for key in ['parent','root']: alias(node[key],count)
                  for key,classes in [('processClass',processes),('threadClass',threads)]:
                      value=node[key]; assert type(value) is int and 0<=value<128
                      if value not in classes:
                          assert value==len(classes); classes.append(value)
                  for key in ['readable','withinAdmittedRoot']: assert type(node[key]) is bool
                  if node['withinAdmittedRoot']:
                      assert node['root']==root
                      if index==root: assert node['parent'] is None
                  else:
                      assert node['root'] is None and node['parent'] is None
              # Node aliases follow first-intern order: gate handles, later sample,
              # then each observed parent/root. No unreferenced or relabelled slots.
              seen=[]
              references=[gate['aliases'][key] for key in gate_keys]+[observation['aliases'][key] for key in post_keys]
              references.extend(value for node in nodes for value in [node['parent'],node['root']])
              for value in references:
                  if value is not None and value not in seen:
                      assert value==len(seen); seen.append(value)
              assert len(seen)==count
              cycle=False; depth_bound=False
              for start in range(count):
                  visited=set(); current=start
                  for _ in range(64):
                      if current is None: break
                      if current in visited:
                          cycle=True; current=None; break
                      visited.add(current); current=nodes[current]['parent']
                  if current is not None: depth_bound=True
              assert observation['cycle'] is cycle and observation['depthBound'] is depth_bound
              if observation['nodeBound']: assert count==64
              all_readable=all(node['readable'] and node['withinAdmittedRoot'] for node in nodes)
              assert observation['unavailable'] or all_readable
              flags=['unavailable','nodeBound','depthBound','cycle']
              complete=not any(observation[key] for key in flags)
              assert (observation['status']=='complete') is complete
              assert scope['windowless'] is (gate['aliases']['ownNative'] is None)
              if complete:
                  assert count>0 and all_readable
                  for key in ['target','root','foreground','focus','providerAnchor']: assert gate['aliases'][key] is not None
                  # A complete rooted graph has one admitted root and every parent
                  # chain terminates there. Null roots, self-cycles and disconnected
                  # non-root nodes cannot claim completeness, regardless of flags.
                  assert nodes[root]['root']==root and nodes[root]['parent'] is None
                  for start in range(count):
                      visited=set(); current=start
                      while current!=root:
                          assert current is not None and current not in visited
                          visited.add(current); current=nodes[current]['parent']
              if observation['matchesGateSnapshot']:
                  assert not (observation['unavailable'] and all_readable)
                  for key in ['foreground','focus','hover']:
                      assert observation['aliases'][key]==gate['aliases'][key]
                  if gate['aliases']['active'] is not None:
                      assert observation['aliases']['active']==gate['aliases']['active']
                  anchor=gate['aliases']['providerAnchor']; focus=gate['aliases']['focus']
                  assert anchor is not None and focus is not None
