          def validate_record(item):
              late=item.get('schema')=='cua-native-input-proof-diagnostic/v2'
              keys={'schema','operation','phase','inputAttempted','gate','additionalObservation'}
              object_keys(item,keys|({'refusalStage'} if late else set()))
              assert item['schema']==('cua-native-input-proof-diagnostic/v2' if late else 'cua-native-input-proof-diagnostic/v1')
              assert item['operation'] in {'retained_key','virtual_wheel'}
              assert item['phase']=='after_refusal' and item['inputAttempted'] is False
              gate=item['gate']; observation=item['additionalObservation']
              minimal={'predicates'}|({'nativeSnapshotEquality'} if late else set())
              assert type(gate) is dict and set(gate) in (minimal,minimal|{'aliases','scope'})
              predicate_keys={'anchorIdentityMatches','focusWithinAnchor'}
              if item['operation']=='virtual_wheel': predicate_keys.add('hoverWithinAnchor')
              if late:
                  assert item['operation']=='retained_key' and item['refusalStage']=='pre_uia_vs_final_native'
                  predicate_keys={'anchorIdentityMatches','nativeCorrelationAdmitted'}
                  equality=gate['nativeSnapshotEquality']; object_keys(equality,equality_keys)
                  assert all(type(value) is bool for value in equality.values()) and not all(equality.values())
              object_keys(gate['predicates'],predicate_keys)
              assert all(type(value) is bool for value in gate['predicates'].values())
              if late: assert all(gate['predicates'].values())
              if set(gate)==minimal:
                  object_keys(observation,{'status','byteBound'})
                  assert observation['status']=='incomplete' and observation['byteBound'] is True
                  return False
              complete=validate_graph(gate,observation)
              if late: assert observation['cursorMatchesGate'] is None
              return complete

          def validate_late(item):
