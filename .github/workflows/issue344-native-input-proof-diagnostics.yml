          def relation_ready(record):
              # Never trust the status/flags of an unvalidated record, including a
              # direct caller outside collect. Readiness is not input authorization.
              try:
                  return validate_record(record) and record['additionalObservation']['matchesGateSnapshot'] is True
              except (AssertionError,KeyError,TypeError,ValueError,AttributeError):
                  return False

          def bind_late_wire(record,result):
              # The owning original failed Enter message is already a string in results.
              # Decode only its fixed witness; never retain its text or provider contents.
              marker='CUA_KEYBOARD_FOCUS_WITNESS_V1 '
              message=result.get('message','')
              assert isinstance(message,str)
              if marker not in message: return False
              assert message.count(marker)==1
              wire,_=json.JSONDecoder(object_pairs_hook=closed_object).raw_decode(message.split(marker,1)[1].lstrip())
              assert set(wire)==wire_keys and wire['version']==1
              assert wire['failureCode']=='native_focus_changed' and wire['inputAttempted'] is False and type(wire['insertedEventCount']) is int and wire['insertedEventCount']==0
              equality=record['gate']['nativeSnapshotEquality']
              assert type(wire['nativeForegroundStable']) is bool and type(wire['nativeFocusStable']) is bool
              assert wire['nativeForegroundStable']==(equality['foreground'] and equality['foregroundThread'])
              assert wire['nativeFocusStable']==all(equality.values()) and wire['nativeFocusStable'] is False
              return True

          def collect(log_text, results, cases, environments, scope, source):
              assert scope['sourceCommit']==source and scope['scope']=='diagnostic_four_owned_cases_only'
              assert scope['baseRuntime']=='a80258ee1ff1e1b38ca87eb571f4552c3b853c54'
              assert scope['canonicalAllAccepted'] is False and scope['packageAccepted'] is False and scope['dellExcelAccepted'] is False
              assert len(results)==4 and {r['cell_id'] for r in results}==expected
              assert all(r['test_status'] in {'pass','fail'} and r['expected_behavior']=={'kind':'deliver'} and 'fixture_state' in r['oracles'] for r in results)
              assert len(cases)==4 and {r['cell_id'] for r in cases}==expected
              assert all(r['expected_behavior']=={'kind':'deliver'} and 'fixture_state' in r['oracles'] for r in cases)
              assert environments and all(e['source_sha']==source and e['status']=='ready' and e['platform']=='windows' and e['display_server']=='win32' for e in environments)
              passed={r['cell_id'] for r in results if r['test_status']=='pass'}
